<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Грибная ферма</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#dbe8f1;--surf:#f4f9fc;--ink:#15283a;--mute:#55697a;--red:#c8352b;--moss:#2e7d4f;--line:#b7cadb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b2d;--surf:#172a42;--ink:#e8f1f8;--mute:#9fb3c6;--red:#e5604f;--moss:#6fc78e;--line:#27405c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1b2d;--surf:#172a42;--ink:#e8f1f8;--mute:#9fb3c6;--red:#e5604f;--moss:#6fc78e;--line:#27405c;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;min-height:100%;-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.1rem;font-weight:600;margin:0 0 4px;color:var(--mute)}
.count{font-size:clamp(2.6rem,12vw,3.6rem);font-weight:800;line-height:1;letter-spacing:-.02em}
.rate{color:var(--mute);margin:6px 0 0}
.stage{position:relative;display:grid;place-items:center;margin:18px 0 22px;height:260px;user-select:none;-webkit-user-select:none}
#shroom{background:none;border:0;padding:0;width:230px;height:230px;cursor:pointer;touch-action:manipulation;transition:transform .08s}
#shroom:active{transform:scale(.94)}
#shroom:focus-visible{outline:3px solid var(--moss);outline-offset:6px;border-radius:50%}
.pop{position:absolute;pointer-events:none;font-weight:800;color:var(--red);animation:up .8s ease-out forwards}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
@media (prefers-reduced-motion:reduce){.pop{animation:none;opacity:0}}
.list{display:grid;gap:8px}
.up{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;text-align:left;width:100%;background:var(--surf);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;cursor:pointer}
.up:disabled{opacity:.5;cursor:default}
.up:not(:disabled):active{border-color:var(--moss)}
.up b{font-weight:600}
.up small{color:var(--mute);grid-column:1}
.up .cost{grid-row:1/3;grid-column:2;font-weight:800;color:var(--red);text-align:right}
.up .own{color:var(--moss);font-weight:600}
footer{margin-top:20px;color:var(--mute);font-size:.85rem;display:flex;justify-content:space-between}
footer button{background:none;border:0;color:var(--mute);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
.tabs{display:flex;gap:8px;margin:16px 0 0}
.tabs button{flex:1;padding:10px;border-radius:999px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sh{font-size:1rem;font-weight:800;margin:18px 0 6px}
#res{min-height:7rem;display:grid;place-items:center;text-align:center;font-weight:600;margin:14px 0}
#res small{color:var(--mute);font-weight:400}
.big{display:block;width:96px;margin:0 auto 4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sk{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:8px;font:inherit;color:var(--ink);text-align:center;cursor:pointer}
.sk[aria-pressed="true"]{border:2px solid var(--moss)}
.sk .th{display:block;width:56px;margin:0 auto 4px}
.sk small{display:block;color:var(--mute);font-size:.75rem}
.sk.lock{opacity:.45;cursor:default;display:grid;place-items:center;font-size:1.6rem}
.ultra svg{animation:hue 3s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ultra svg{animation:none}}
.garland{height:16px;margin:0 -16px 10px;background:radial-gradient(circle at 10px 9px,#e5604f 0 5px,transparent 6px) 0 0/60px 16px repeat-x,radial-gradient(circle at 30px 9px,#f2c14e 0 5px,transparent 6px) 0 0/60px 16px repeat-x,radial-gradient(circle at 50px 9px,#4fc27f 0 5px,transparent 6px) 0 0/60px 16px repeat-x,linear-gradient(var(--ink),var(--ink)) 0 3px/100% 2px no-repeat;animation:tw 2.4s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.55}}
@media (prefers-reduced-motion:reduce){.garland{animation:none}}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.th svg,.big svg,.mn svg{height:auto}
.sk[aria-pressed="true"]{box-shadow:0 0 0 3px var(--moss)}
.shh{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.shh .sh{margin:0}
.pill{border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.case{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px}
.case .ic{font-size:2.2rem}
.pv{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.mn{width:26px;border:2px solid;border-radius:6px;padding:1px;background:var(--bg)}
.ci small{color:var(--mute);font-size:.78rem;line-height:1.3;display:block}
.buy{background:var(--red);color:#fff;border:0;border-radius:999px;padding:10px 16px;font:inherit;font-weight:800;cursor:pointer}
.buy:disabled{opacity:.45;cursor:default}
</style>
</head>
<body>
<main>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="garland" aria-hidden="true"></div>
<h1>Грибная ферма · Новый год 🎄</h1>
<div class="count" id="n">0</div>
<p class="rate" id="r"></p>
<div class="tabs"><button id="tF" aria-pressed="true">Ферма</button><button id="tS" aria-pressed="false">🎁 Магазин</button></div>
<div id="farm">
<div class="stage" id="stage">
<button id="shroom" aria-label="Собрать споры">
<span id="art" style="display:block;width:100%;height:100%"></span>
</button>
</div>
<div class="list" id="list"></div>
</div>
<div id="shop" hidden><div id="res" aria-live="polite">Открой кейс: вдруг выпадет редкий скин!</div><div class="list" id="cases"></div><div class="shh"><p class="sh" id="prog"></p><button class="pill" id="hatb"></button></div><div class="grid" id="coll"></div></div>
<footer><span id="tot"></span><button id="reset">Начать заново</button></footer>
</main>
<script>
(function(){
var ITEMS=[
{id:"myc",name:"Мицелий",desc:"Тонкие нити собирают споры",base:15,cps:0.2},
{id:"pick",name:"Грибник",desc:"Ходит по лесу с корзиной",base:100,cps:1.5},
{id:"log",name:"Колода",desc:"Грибы растут прямо на дереве",base:1100,cps:9},
{id:"green",name:"Теплица",desc:"Сырость и тепло круглый год",base:12000,cps:50},
{id:"forest",name:"Свой лес",desc:"Грибы до самого горизонта",base:130000,cps:280}
];
var KEY="mushroom-clicker-v1";
var S={spores:0,total:0,power:0,own:{},t:Date.now()};
function load(){try{var v=localStorage.getItem(KEY);if(v){var o=JSON.parse(v);if(o&&typeof o.spores==="number")S=o}}catch(e){}}
function save(){try{S.t=Date.now();localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function cps(){var c=0;ITEMS.forEach(function(i){c+=(S.own[i.id]||0)*i.cps});return c}
function clickVal(){return 1+S.power}
function costOf(i){return Math.ceil(i.base*Math.pow(1.15,S.own[i.id]||0))}
function powerCost(){return Math.ceil(25*Math.pow(1.7,S.power))}
function fmt(x){
if(x<1000)return (Math.floor(x*10)/10).toString().replace(".",",").replace(/,0$/,"");
var u=["","тыс.","млн","млрд","трлн"],k=0;
while(x>=1000&&k<4){x/=1000;k++}
return x.toFixed(x<10?2:1).replace(".",",")+" "+u[k]}
function fmtI(x){return x<1000?String(Math.floor(x)):fmt(x)}
load();
if(!S.skins)S.skins={own:["classic"],cur:"classic"};
var off=Math.min((Date.now()-(S.t||Date.now()))/1000,8*3600);
if(off>5&&cps()>0){var g=off*cps();S.spores+=g;S.total+=g}
var list=document.getElementById("list"),btns={};
function mk(id,name,desc){
var b=document.createElement("button");b.className="up";
b.innerHTML='<span><b>'+name+'</b> <span class="own"></span></span><small>'+desc+'</small><span class="cost"></span>';
list.appendChild(b);btns[id]=b;return b}
var pb=mk("power","Лупа и пинцет","Больше спор за каждый клик");
pb.onclick=function(){var c=powerCost();if(S.spores>=c){S.spores-=c;S.power++;draw()}};
ITEMS.forEach(function(i){mk(i.id,i.name,i.desc).onclick=function(){var c=costOf(i);if(S.spores>=c){S.spores-=c;S.own[i.id]=(S.own[i.id]||0)+1;draw()}}});
function draw(){
document.getElementById("n").textContent=fmtI(S.spores);
var c=cps();
document.getElementById("r").textContent=c>0?"+"+fmt(c)+" в секунду · "+fmt(clickVal())+" за клик":fmt(clickVal())+" за клик";
document.getElementById("tot").textContent="Всего собрано: "+fmtI(S.total);
var p=btns.power;p.disabled=S.spores<powerCost();
p.querySelector(".own").textContent="уровень "+(S.power+1);
p.querySelector(".cost").textContent=fmtI(powerCost());
ITEMS.forEach(function(i){var b=btns[i.id],cs=costOf(i);b.disabled=S.spores<cs;
b.querySelector(".own").textContent=(S.own[i.id]||0)?"× "+S.own[i.id]:"";
b.querySelector("small").textContent=i.desc+" · +"+fmt(i.cps)+"/с";
b.querySelector(".cost").textContent=fmtI(cs)})}
var stage=document.getElementById("stage");
document.getElementById("shroom").addEventListener("click",function(e){
var v=clickVal();S.spores+=v;S.total+=v;
var r=stage.getBoundingClientRect(),el=document.createElement("span");
el.className="pop";el.textContent="+"+fmt(v);
var x=(e.clientX||r.left+r.width/2)-r.left,y=(e.clientY||r.top+r.height/2)-r.top;
el.style.left=(x-10+(Math.random()*30-15))+"px";el.style.top=(y-20)+"px";
stage.appendChild(el);setTimeout(function(){el.remove()},800);draw()});
var last=Date.now();
setInterval(function(){var n=Date.now(),dt=(n-last)/1000;last=n;var g=cps()*dt;S.spores+=g;S.total+=g;draw()},100);
setInterval(save,5000);
window.addEventListener("pagehide",save);
document.getElementById("reset").onclick=function(){
if(confirm("Удалить весь прогресс и начать заново?")){S={spores:0,total:0,power:0,own:{},skins:{own:["classic"],cur:"classic"},t:Date.now()};setSkin("classic",1);renderShop();save();draw()}};

var $=function(i){return document.getElementById(i)};
var SK={classic:{n:"Классика",cap:"#c8352b",sp:"#f5f6ea",st:"#efe6cf",r:"обычный"},
forest:{n:"Лесной",cap:"#8a5a34",sp:"#e9d9b8",st:"#efe6cf",r:"обычный"},
snow:{n:"Снежный",cap:"#e4eef6",sp:"#6fa8d6",st:"#f4f9fc",r:"обычный"},
candy:{n:"Леденец",cap:"#e0467c",sp:"#ffffff",st:"#fbe3ec",r:"обычный"},
violet:{n:"Лиловый",cap:"#7b4fb5",sp:"#efe3ff",st:"#efe6cf",r:"редкий"},
ice:{n:"Ледяной",cap:"#4fa8d8",sp:"#ffffff",st:"#e3f4fb",r:"редкий"},
tree:{n:"Ёлочный",cap:"#2e7d4f",sp:"#f2c14e",st:"#e6efd9",r:"редкий"},
gold:{n:"Золотой",cap:"#e0a81c",sp:"#fff6cf",st:"#f6e9b5",r:"эпический"},
night:{n:"Ночной",cap:"#243a66",sp:"#ffd86b",st:"#d9def0",r:"эпический"},
lava:{n:"Лавовый",cap:"#ff5a1f",sp:"#ffd23f",st:"#f6e0c8",r:"эпический"},
rainbow:{n:"Радужный",cap:"#e53935",sp:"#ffffff",st:"#fff3d6",r:"легендарный"},
ultra:{n:"Ультра пиксель-гриб",r:"ультра"}};
var RC={"обычный":"#8fa3b3","редкий":"#3d8fd6","эпический":"#9b4fd6","легендарный":"#f08a24","ультра":"#e5384f"};
var CASES=[
{id:"c1",n:"Лесной кейс",ic:"🎁",cost:500,odds:{forest:20,snow:20,candy:20,violet:12,ice:10,tree:10,gold:3.5,night:2.5,lava:1.4,rainbow:0.5,ultra:0.1}},
{id:"c2",n:"Новогодний кейс",ic:"🎄",cost:3000,odds:{snow:20,candy:20,violet:15,ice:15,tree:15,gold:8,night:4,lava:2,rainbow:0.9,ultra:0.1}},
{id:"c3",n:"Золотой кейс",ic:"👑",cost:15000,odds:{violet:15,ice:20,tree:20,gold:22,night:12,lava:8.9,rainbow:2,ultra:0.1}}];
var PX=["................","....dddddddd....","..ddrrwwrrrrdd..",".drrrrrrrrrwwrd.","drrwwrrrrrrrrrrd","drrwwrrrrrrrwwrd","drrrrrrrrrrrwwrd","dddddddddddddddd","......dssskd....","......dssskd....","......dssskd....","......dssskd....","......dssskd....","......dddddd....","................","................"];
var PH=[".........ww.....","......hhhhhwww..",".....hhhhhhhh...","....hhhhhhhh....","...hhhhhhhh.....","..ffffffffffff..","...ffffffffff..."];
var PC={d:"#2b1b17",r:"#d32f2f",w:"#ffffff",s:"#efe6cf",k:"#d2c6a5",h:"#8e1b1b",f:"#ffffff"};
var HAT='<g transform="rotate(-12 92 22)"><path d="M52 16C56-14 100-20 130-6C142 0 148 10 146 24L134 16Z" fill="#b3261e" stroke="#15283a" stroke-width="3" stroke-linejoin="round"/><rect x="47" y="12" width="90" height="20" rx="10" fill="#fff" stroke="#15283a" stroke-width="3"/><circle cx="150" cy="24" r="9" fill="#fff" stroke="#15283a" stroke-width="3"/></g>';
var busy=false;
function rects(rows,y0){var o="";rows.forEach(function(row,y){for(var x=0;x<16;x++){var c=row.charAt(x);if(c!==".")o+='<rect x="'+x+'" y="'+(y+y0)+'" width="1" height="1" fill="'+PC[c]+'"/>'}});return o}
function art(id,hat){var k=SK[id];
if(id==="ultra")return '<svg viewBox="0 -4 16 20" width="100%" height="100%" shape-rendering="crispEdges" aria-hidden="true">'+rects(PX,0)+(hat?rects(PH,-4):"")+'</svg>';
return '<svg viewBox="0 -26 200 226" width="100%" height="100%" aria-hidden="true"><path d="M78 112h44l6 62c0 8-12 14-28 14s-28-6-28-14z" fill="'+k.st+'" stroke="#15283a" stroke-width="4" stroke-linejoin="round"/><path d="M12 116C12 54 52 16 100 16s88 38 88 100c0 8-8 12-16 12H28c-8 0-16-4-16-12z" fill="'+k.cap+'" stroke="#15283a" stroke-width="4" stroke-linejoin="round"/><g fill="'+k.sp+'"><circle cx="60" cy="78" r="13"/><circle cx="108" cy="52" r="10"/><circle cx="142" cy="92" r="15"/><circle cx="92" cy="98" r="8"/><circle cx="40" cy="108" r="6"/></g>'+(hat?HAT:"")+'</svg>'}
function pct(v){return String(v).replace(".",",")+"%"}
function hatOn(){return S.skins.hat!==false}
function setSkin(id,ns){S.skins.cur=id;$("art").innerHTML=art(id,hatOn());$("art").className=(id==="ultra"||id==="rainbow")?"ultra":"";if(!ns){renderShop();save()}}
function roll(c){var ks=Object.keys(c.odds),t=0,a=0,i;ks.forEach(function(k){t+=c.odds[k]});var r=Math.random()*t;for(i=0;i<ks.length;i++){a+=c.odds[ks[i]];if(r<a)return ks[i]}return ks[0]}
function renderShop(){var h="";Object.keys(SK).forEach(function(k){var o=S.skins.own.indexOf(k)>=0;
if(o)h+='<button class="sk" style="border-color:'+RC[SK[k].r]+'" data-s="'+k+'" aria-pressed="'+(S.skins.cur===k)+'"><span class="th">'+art(k,false)+'</span><b style="font-size:.8rem">'+SK[k].n+'</b><small>'+(S.skins.cur===k?"надет":SK[k].r)+'</small></button>';
else h+='<div class="sk lock" style="border-color:'+RC[SK[k].r]+'">?<small>'+SK[k].r+'</small></div>'});
$("coll").innerHTML=h;$("prog").textContent="Коллекция: "+S.skins.own.length+" из "+Object.keys(SK).length;
$("hatb").textContent="🎅 Шапка: "+(hatOn()?"вкл":"выкл");$("hatb").setAttribute("aria-pressed",hatOn())}
var ch="";CASES.forEach(function(c){var ks=Object.keys(c.odds),pv="",rare=ks.slice().sort(function(a,b){return c.odds[a]-c.odds[b]}).slice(0,3).map(function(k){return SK[k].n+" "+pct(c.odds[k])}).join(" · ");
ks.slice().sort(function(a,b){return c.odds[b]-c.odds[a]}).forEach(function(k){pv+='<span class="mn" style="border-color:'+RC[SK[k].r]+'">'+art(k,false)+'</span>'});
ch+='<div class="case"><div class="ic">'+c.ic+'</div><div class="ci"><b>'+c.n+'</b><div class="pv">'+pv+'</div><small>Шансы: '+rare+'</small></div><button class="buy" data-c="'+c.id+'">'+fmtI(c.cost)+'</button></div>'});
$("cases").innerHTML=ch;
function updShop(){CASES.forEach(function(c){var b=document.querySelector('[data-c="'+c.id+'"]');if(b)b.disabled=busy||S.spores<c.cost})}
function openCase(c){if(busy||S.spores<c.cost)return;busy=true;S.spores-=c.cost;draw();
var res=roll(c),ks=Object.keys(SK),i=0,box=$("res");box.style.boxShadow="none";
var t=setInterval(function(){box.innerHTML='<span><span class="big">'+art(ks[Math.floor(Math.random()*ks.length)],false)+'</span>Открываем…</span>';
if(++i>9){clearInterval(t);fin()}},90);
function fin(){var own=S.skins.own,msg;
if(own.indexOf(res)>=0){var back=Math.floor(c.cost*0.3);S.spores+=back;msg="Повтор: "+SK[res].n+"<br><small>Вернули "+fmtI(back)+" спор</small>"}
else{own.push(res);setSkin(res,1);msg="Новый скин: "+SK[res].n+"! "+(res==="ultra"?"🎉":"")+"<br><small>"+SK[res].r+" · он уже надет</small>"}
box.style.boxShadow="0 0 0 3px "+RC[SK[res].r]+" inset";box.style.borderRadius="14px";
box.innerHTML='<span><span class="big">'+art(res,hatOn())+'</span>'+msg+'</span>';busy=false;renderShop();draw();save()}}
$("cases").onclick=function(e){var b=e.target.closest("[data-c]");if(!b)return;var id=b.getAttribute("data-c");openCase(CASES.filter(function(x){return x.id===id})[0])};
$("coll").onclick=function(e){var b=e.target.closest("[data-s]");if(b)setSkin(b.getAttribute("data-s"))};
$("hatb").onclick=function(){S.skins.hat=!hatOn();setSkin(S.skins.cur)};
function tab(t){$("farm").hidden=t!=="f";$("shop").hidden=t!=="s";$("tF").setAttribute("aria-pressed",t==="f");$("tS").setAttribute("aria-pressed",t==="s")}
$("tF").onclick=function(){tab("f")};$("tS").onclick=function(){tab("s")};
setInterval(updShop,200);
setSkin(S.skins.cur,1);renderShop();
var cv=$("snow"),cx=cv.getContext("2d"),W=0,H=0,fl=[],dk=matchMedia("(prefers-color-scheme: dark)").matches;
function sz(){var d=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
sz();addEventListener("resize",sz);
for(var q=0;q<70;q++)fl.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.6,v:.4+Math.random(),p:Math.random()*6});
function snow(t){cx.clearRect(0,0,W,H);cx.fillStyle="#fff";cx.shadowColor="rgba(70,100,135,.55)";cx.shadowBlur=dk?0:3;
fl.forEach(function(f){f.y+=f.v;f.x+=Math.sin(t/1200+f.p)*.35;if(f.y>H+5){f.y=-5;f.x=Math.random()*W}cx.beginPath();cx.arc(f.x,f.y,f.r,0,6.283);cx.fill()});requestAnimationFrame(snow)}
if(!matchMedia("(prefers-reduced-motion: reduce)").matches)requestAnimationFrame(snow);
draw();
})();
</script>
</body>
</html>
