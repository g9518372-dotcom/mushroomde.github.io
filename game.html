<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Грибная ферма</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#e8ebd9;--surf:#f5f6ea;--ink:#1f2a22;--mute:#5d695e;--red:#c8352b;--moss:#4f7236;--line:#cdd3b8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17201a;--surf:#202b23;--ink:#e6ead8;--mute:#9aa795;--red:#e5604f;--moss:#8fb56a;--line:#33423a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17201a;--surf:#202b23;--ink:#e6ead8;--mute:#9aa795;--red:#e5604f;--moss:#8fb56a;--line:#33423a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;min-height:100%;-webkit-tap-highlight-color:transparent}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.1rem;font-weight:600;margin:0 0 4px;color:var(--mute)}
.count{font-size:clamp(2.6rem,12vw,3.6rem);font-weight:800;line-height:1;letter-spacing:-.02em}
.rate{color:var(--mute);margin:6px 0 0}
.stage{position:relative;display:grid;place-items:center;margin:18px 0 22px;height:260px;user-select:none;-webkit-user-select:none}
#shroom{background:none;border:0;padding:0;width:230px;height:230px;cursor:pointer;touch-action:manipulation;transition:transform .08s}
#shroom:active{transform:scale(.94)}
#shroom:focus-visible{outline:3px solid var(--moss);outline-offset:6px;border-radius:50%}
.pop{position:absolute;pointer-events:none;font-weight:800;color:var(--red);animation:up .8s ease-out forwards}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
@media (prefers-reduced-motion:reduce){.pop{animation:none;opacity:0}}
.list{display:grid;gap:8px}
.up{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;text-align:left;width:100%;background:var(--surf);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;cursor:pointer}
.up:disabled{opacity:.5;cursor:default}
.up:not(:disabled):active{border-color:var(--moss)}
.up b{font-weight:600}
.up small{color:var(--mute);grid-column:1}
.up .cost{grid-row:1/3;grid-column:2;font-weight:800;color:var(--red);text-align:right}
.up .own{color:var(--moss);font-weight:600}
footer{margin-top:20px;color:var(--mute);font-size:.85rem;display:flex;justify-content:space-between}
footer button{background:none;border:0;color:var(--mute);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
</style>
</head>
<body>
<main>
<h1>Грибная ферма</h1>
<div class="count" id="n">0</div>
<p class="rate" id="r"></p>
<div class="stage" id="stage">
<button id="shroom" aria-label="Собрать споры">
<svg viewBox="0 0 200 200" width="100%" height="100%" aria-hidden="true">
<path d="M78 112h44l6 62c0 8-12 14-28 14s-28-6-28-14z" fill="#efe6cf" stroke="#1f2a22" stroke-width="4" stroke-linejoin="round"/>
<path d="M12 116C12 54 52 16 100 16s88 38 88 100c0 8-8 12-16 12H28c-8 0-16-4-16-12z" fill="#c8352b" stroke="#1f2a22" stroke-width="4" stroke-linejoin="round"/>
<g fill="#f5f6ea"><circle cx="60" cy="78" r="13"/><circle cx="108" cy="52" r="10"/><circle cx="142" cy="92" r="15"/><circle cx="92" cy="98" r="8"/><circle cx="40" cy="108" r="6"/></g>
</svg>
</button>
</div>
<div class="list" id="list"></div>
<footer><span id="tot"></span><button id="reset">Начать заново</button></footer>
</main>
<script>
(function(){
var ITEMS=[
{id:"myc",name:"Мицелий",desc:"Тонкие нити собирают споры",base:15,cps:0.2},
{id:"pick",name:"Грибник",desc:"Ходит по лесу с корзиной",base:100,cps:1.5},
{id:"log",name:"Колода",desc:"Грибы растут прямо на дереве",base:1100,cps:9},
{id:"green",name:"Теплица",desc:"Сырость и тепло круглый год",base:12000,cps:50},
{id:"forest",name:"Свой лес",desc:"Грибы до самого горизонта",base:130000,cps:280}
];
var KEY="mushroom-clicker-v1";
var S={spores:0,total:0,power:0,own:{},t:Date.now()};
function load(){try{var v=localStorage.getItem(KEY);if(v){var o=JSON.parse(v);if(o&&typeof o.spores==="number")S=o}}catch(e){}}
function save(){try{S.t=Date.now();localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function cps(){var c=0;ITEMS.forEach(function(i){c+=(S.own[i.id]||0)*i.cps});return c}
function clickVal(){return 1+S.power}
function costOf(i){return Math.ceil(i.base*Math.pow(1.15,S.own[i.id]||0))}
function powerCost(){return Math.ceil(25*Math.pow(1.7,S.power))}
function fmt(x){
if(x<1000)return (Math.floor(x*10)/10).toString().replace(".",",").replace(/,0$/,"");
var u=["","тыс.","млн","млрд","трлн"],k=0;
while(x>=1000&&k<4){x/=1000;k++}
return x.toFixed(x<10?2:1).replace(".",",")+" "+u[k]}
function fmtI(x){return x<1000?String(Math.floor(x)):fmt(x)}
load();
var off=Math.min((Date.now()-(S.t||Date.now()))/1000,8*3600);
if(off>5&&cps()>0){var g=off*cps();S.spores+=g;S.total+=g}
var list=document.getElementById("list"),btns={};
function mk(id,name,desc){
var b=document.createElement("button");b.className="up";
b.innerHTML='<span><b>'+name+'</b> <span class="own"></span></span><small>'+desc+'</small><span class="cost"></span>';
list.appendChild(b);btns[id]=b;return b}
var pb=mk("power","Лупа и пинцет","Больше спор за каждый клик");
pb.onclick=function(){var c=powerCost();if(S.spores>=c){S.spores-=c;S.power++;draw()}};
ITEMS.forEach(function(i){mk(i.id,i.name,i.desc).onclick=function(){var c=costOf(i);if(S.spores>=c){S.spores-=c;S.own[i.id]=(S.own[i.id]||0)+1;draw()}}});
function draw(){
document.getElementById("n").textContent=fmtI(S.spores);
var c=cps();
document.getElementById("r").textContent=c>0?"+"+fmt(c)+" в секунду · "+fmt(clickVal())+" за клик":fmt(clickVal())+" за клик";
document.getElementById("tot").textContent="Всего собрано: "+fmtI(S.total);
var p=btns.power;p.disabled=S.spores<powerCost();
p.querySelector(".own").textContent="уровень "+(S.power+1);
p.querySelector(".cost").textContent=fmtI(powerCost());
ITEMS.forEach(function(i){var b=btns[i.id],cs=costOf(i);b.disabled=S.spores<cs;
b.querySelector(".own").textContent=(S.own[i.id]||0)?"× "+S.own[i.id]:"";
b.querySelector("small").textContent=i.desc+" · +"+fmt(i.cps)+"/с";
b.querySelector(".cost").textContent=fmtI(cs)})}
var stage=document.getElementById("stage");
document.getElementById("shroom").addEventListener("click",function(e){
var v=clickVal();S.spores+=v;S.total+=v;
var r=stage.getBoundingClientRect(),el=document.createElement("span");
el.className="pop";el.textContent="+"+fmt(v);
var x=(e.clientX||r.left+r.width/2)-r.left,y=(e.clientY||r.top+r.height/2)-r.top;
el.style.left=(x-10+(Math.random()*30-15))+"px";el.style.top=(y-20)+"px";
stage.appendChild(el);setTimeout(function(){el.remove()},800);draw()});
var last=Date.now();
setInterval(function(){var n=Date.now(),dt=(n-last)/1000;last=n;var g=cps()*dt;S.spores+=g;S.total+=g;draw()},100);
setInterval(save,5000);
window.addEventListener("pagehide",save);
document.getElementById("reset").onclick=function(){
if(confirm("Удалить весь прогресс и начать заново?")){S={spores:0,total:0,power:0,own:{},t:Date.now()};save();draw()}};
draw();
})();
</script>
</body>
</html>
