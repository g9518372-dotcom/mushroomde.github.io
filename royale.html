function newSlot(){if(NET.live||document.querySelectorAll&&NET.lp.length>=19)return;
var pc=new RTCPeerConnection(CFG),c=wrap(pc.createDataChannel("g")),d=document.createElement("div"),pl={conn:c,sk:"classic",name:"Игрок"};
d.className="slot";d.innerHTML='1) Отправь другу этот код:<textarea class="o" readonly></textarea><button class="btn cpo" style="padding:6px 14px;font-size:.85rem">Копировать</button><br>2) Вставь сюда его ответ:<textarea class="a"></textarea><button class="btn acc" style="padding:6px 14px;font-size:.85rem;background:#2e7d4f">Принять</button> <span class="s"></span>';
$("slots").appendChild(d);var q=function(x){return d.querySelector(x)};
pc.createOffer().then(function(o){return pc.setLocalDescription(o)}).then(function(){return gather(pc)}).then(function(){q(".o").value=enc(pc.localDescription)});
q(".cpo").onclick=function(){cp(q(".o"),this)};
q(".acc").onclick=function(){var dd;try{dd=JSON.parse(atob(q(".a").value.trim()))}catch(x){q(".s").textContent="Неверный код";return}
pc.setRemoteDescription(dd).then(function(){q(".s").textContent="Соединяем…"},function(){q(".s").textContent="Неверный код"})};
c.on("open",function(){q(".s").textContent="Подключился ✓"});
c.on("data",function(m){if(m.hello){if(NET.lp.indexOf(pl)<0&&NET.lp.length<19&&!NET.live){pl.sk=SKC[m.hello.sk]?m.hello.sk:"classic";NET.lp.push(pl);pl.name="Игрок "+NET.lp.length;upd()}}
else if(pl.e){if(m.in)pl.e.inp=m.in;if(m.j)jump(pl.e)}});
c.on("close",function(){var i=NET.lp.indexOf(pl);if(pl.e){pl.e.bot=true;pl.e.sd=1}else if(i>=0){NET.lp.splice(i,1);upd()}})}
function hostRoom(){if(!rtcOk())return;$("jn").hidden=true;$("slots").innerHTML="";NET.lp=[];$("more").hidden=false;$("go").hidden=false;upd();newSlot()}
function joinRoom(){if(!rtcOk())return;$("slots").innerHTML="";$("more").hidden=true;$("go").hidden=true;$("jn").hidden=false;st("Вставь код от хозяина комнаты и нажми «Подключиться»")}
function doJoin(){var dd;try{dd=JSON.parse(atob($("inc").value.trim()))}catch(x){st("Неверный код. Скопируй его целиком.");return}
var pc=new RTCPeerConnection(CFG);
pc.ondatachannel=function(e){var c=wrap(e.channel);NET.conn=c;
var go=function(){c.send({hello:{sk:pskin()}});st("Подключено! Ждём, пока хозяин нажмёт «Старт»…")};
c.on("data",onMsg);c.on("close",function(){st("Хозяин отключился");$("menu").hidden=false;running=false;NET.cl=false});c.on("open",go);if(c.open)go()};
st("Готовлю ответ…");
pc.setRemoteDescription(dd).then(function(){return pc.createAnswer()}).then(function(a){return pc.setLocalDescription(a)}).then(function(){return gather(pc)}).then(function(){$("out").value=enc(pc.localDescription);$("ow").hidden=false;st("Отправь код ниже хозяину и жди подключения.")},function(){st("Не получилось. Проверь код.")})}
function onMsg(m){
if(m.go){NET.cl=true;var sr=rngs(m.seed);G={t:0,bus:{x:0,y:0,dx:1,dy:0,p:0},ents:[],bl:[],loot:[],trees:[],feed:[],over:false,pl:null,me:m.me};
for(var i=0;i<70;i++)G.trees.push({x:60+sr()*(WS-120),y:60+sr()*(WS-120),r:22+sr()*18});
$("menu").hidden=true;$("end").hidden=true;running=true}
else if(m.s&&G&&NET.cl){
while(G.ents.length<m.s.length)G.ents.push({st:"bus",x:0,y:0,ang:0,hp:100,fz:0,sk:"classic",alive:true,name:"",kills:0,w:0,ammo:0});
m.s.forEach(function(a,i){var e=G.ents[i];e.x=a[0];e.y=a[1];e.ang=a[2]/100;e.hp=a[3];e.st=STN[a[4]];e.fz=a[5]/10;e.sk=SKC[a[6]]?a[6]:"classic";e.alive=!!a[7];e.name=a[8];e.kills=a[9];e.w=a[10];e.ammo=a[11]});
G.pl=G.ents[G.me];G.bl=m.b.map(function(a){return{x:a[0],y:a[1]}});G.loot=m.l.map(function(a){return{x:a[0],y:a[1],t:a[2]}});
G.t=m.t;G.bus.x=m.bu[0];G.bus.y=m.bu[1];G.bus.p=m.bu[2];G.bus.dx=m.bu[3];G.bus.dy=m.bu[4];G.feed=m.f;
$("jump").hidden=!(G.pl.alive&&G.pl.st==="bus")}
else if(m.end!==undefined){var win=!!m.end;$("et").textContent=win?"🏆 Победа!":"Ты выбыл";$("es").textContent=(win?"Ты последний гриб на поляне. ":"Место: "+m.pos+" из 20. ")+"Убийств: "+m.k;setTimeout(function(){$("end").hidden=false},900)}}
function snap(){return{s:G.ents.map(function(e){return[e.x|0,e.y|0,(e.ang*100)|0,e.hp|0,e.st==="bus"?0:e.st==="fall"?1:2,(e.fz*10)|0,e.sk,e.alive?1:0,e.name,e.kills,e.w,e.ammo]}),b:G.bl.map(function(u){return[u.x|0,u.y|0]}),l:G.loot.map(function(l){return[l.x|0,l.y|0,l.t]}),t:G.t,bu:[G.bus.x|0,G.bus.y|0,G.bus.p,G.bus.dx,G.bus.dy],f:G.feed}}
function netTick(dt){if(!NET.live)return;NET.acc+=dt;if(NET.acc<.066)return;NET.acc=0;var m=snap();NET.lp.forEach(function(p){try{if(p.conn.open)p.conn.send(m)}catch(x){}})}
setInterval(function(){if(NET.cl&&NET.conn&&NET.conn.open&&G)try{NET.conn.send({in:{x:mx(),y:my(),f:(fireH||keys[" "])?1:0}})}catch(x){}},60);
function doJump(){if(!G)return;if(NET.cl){try{NET.conn.send({j:1})}catch(x){}}else jump(G.pl)}
function loop(t){requestAnimationFrame(loop);if(!running||!G)return;var dt=Math.min(.05,(t-last)/1000||0);last=t;if(!NET.cl){update(dt);netTick(dt)}if(G.pl)draw()}
cv.addEventListener("pointerdown",function(e){if(e.clientX<W*.6&&stick.id===null){stick.id=e.pointerId;stick.ox=stick.cx=e.clientX;stick.oy=stick.cy=e.clientY;try{cv.setPointerCapture(e.pointerId)}catch(x){}}});
cv.addEventListener("pointermove",function(e){if(e.pointerId!==stick.id)return;var dx=e.clientX-stick.ox,dy=e.clientY-stick.oy,l=Math.hypot(dx,dy),m=Math.min(l,50);if(l>0){dx=dx/l*m;dy=dy/l*m}stick.cx=stick.ox+dx;stick.cy=stick.oy+dy;stick.x=dx/50;stick.y=dy/50});
function up(e){if(e.pointerId===stick.id){stick.id=null;stick.x=stick.y=0}}
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
$("fire").addEventListener("pointerdown",function(e){e.preventDefault();fireH=true});
["pointerup","pointerleave","pointercancel"].forEach(function(n){$("fire").addEventListener(n,function(){fireH=false})});
$("jump").addEventListener("pointerdown",function(e){e.preventDefault();doJump()});
addEventListener("keydown",function(e){keys[e.key.toLowerCase()]=true;if(e.key==="j")doJump()});
addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=false});
$("play").onclick=function(){start()};
$("again").onclick=function(){if(NET.live||NET.cl)location.reload();else start()};
$("host").onclick=hostRoom;$("join").onclick=joinRoom;$("more").onclick=newSlot;$("jgo").onclick=doJoin;$("cpo").onclick=function(){cp($("out"),this)};
$("go").onclick=function(){if(NET.live)return;NET.live=true;start(NET.lp.slice())};
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
