 if(t==="me")c=`<h2>Ник</h2><input id="nick" maxlength="14" style="font-size:18px;letter-spacing:0;text-align:left"><p class="hint">Рекорд: раунд ${SV.best}.</p>`;
 $("menu").innerHTML=`<div id="mh"><span id="mn"></span><span>${SV.coins} 🪙</span></div><div id="tabs">${tabs.map(a=>`<button class="${a[0]===t?"on":""}" onclick="tabShow('${a[0]}')">${a[1]}</button>`).join("")}</div><div id="mc">${c}</div>`;
 $("mn").textContent=SV.nick;if(t==="me"){$("nick").value=SV.nick;$("nick").oninput=e=>{SV.nick=e.target.value.slice(0,14)||"Игрок";save();$("mn").textContent=SV.nick}}}
function buy(k,id){const kk=k+":"+id,price=k==="w"?W[id].price:k==="ws"?WSK[id][2]:BSK[id][2],has=k==="w"?SV.own.includes(id):SV.ownS.includes(kk);
 if(!has){if(SV.coins<price)return toast("Не хватает монет");SV.coins-=price;(k==="w"?SV.own:SV.ownS).push(k==="w"?id:kk)}
 if(k==="ws")SV.ws=id;if(k==="bs")SV.bs=id;save();if(vmw)buildVM(cur);tabShow("shop");hud()}
function setTeam(t){SV.team=t;save();tabShow("team")}
$("mb").addEventListener("click",()=>openMenu("play"));
// ---------- input ----------
addEventListener("keydown",e=>{key[e.code]=1;if(e.code==="KeyE")actHeld=true;if(inMenu)return;if(e.code==="KeyR")reload();const n=+e.key;if(n>=1&&n<=5)sel(ORDER[n-1]);if(e.code==="Escape")openMenu("play")});
addEventListener("keyup",e=>{key[e.code]=0;if(e.code==="KeyE")actHeld=false});
addEventListener("mousemove",e=>{if(document.pointerLockElement&&!inMenu&&alive){const f=zoomed?.4:1;yaw-=e.movementX*.0025*f;pitch=clamp(pitch-e.movementY*.0025*f,-1.3,1.3)}});
document.addEventListener("pointerlockchange",()=>{if(!document.pointerLockElement&&!inMenu&&!touch)openMenu("play")});
R.domElement.addEventListener("mousedown",e=>{if(inMenu)return;if(!alive){spec++;return}if(e.button===2)zoom();else{fh=true;shoot()}});
addEventListener("mouseup",()=>fh=false);addEventListener("contextmenu",e=>e.preventDefault());
addEventListener("wheel",e=>{if(inMenu)return;const l=ORDER.filter(k=>SV.own.includes(k)),i=l.indexOf(cur);sel(l[(i+(e.deltaY>0?1:l.length-1))%l.length])},{passive:true});
function nextW(){if(!alive){spec++;return}const l=ORDER.filter(k=>SV.own.includes(k));sel(l[(l.indexOf(cur)+1)%l.length])}
if(touch){["fire","rl","nx","zm","ac"].forEach(i=>$(i).style.display="block");$("stick").style.display="block"}
const st=$("stick"),kn=$("knob");let sId=null,lId=null,lx=0,ly=0;
addEventListener("touchstart",e=>{if(inMenu)return;for(const t of e.changedTouches){if(t.target.closest&&t.target.closest("button,#slots"))continue;const r=st.getBoundingClientRect();
 if(sId===null&&t.clientX<r.right+30&&t.clientY>r.top-30)sId=t.identifier;else if(lId===null){lId=t.identifier;lx=t.clientX;ly=t.clientY}}},{passive:true});
addEventListener("touchmove",e=>{for(const t of e.changedTouches){if(t.identifier===sId){const r=st.getBoundingClientRect(),dx=t.clientX-(r.left+60),dy=t.clientY-(r.top+60),l=Math.min(1,Math.hypot(dx,dy)/50),a=Math.atan2(dy,dx);mv.x=Math.cos(a)*l;mv.y=Math.sin(a)*l;kn.style.transform=`translate(${mv.x*40}px,${mv.y*40}px)`}
 else if(t.identifier===lId&&alive){const f=zoomed?.4:1;yaw-=(t.clientX-lx)*.006*f;pitch=clamp(pitch-(t.clientY-ly)*.005*f,-1.3,1.3);lx=t.clientX;ly=t.clientY}}},{passive:true});
addEventListener("touchend",e=>{for(const t of e.changedTouches){if(t.identifier===sId){sId=null;mv.x=mv.y=0;kn.style.transform=""}if(t.identifier===lId)lId=null}});
$("fire").addEventListener("touchstart",e=>{e.preventDefault();if(!alive){spec++;return}fh=true;shoot()});$("fire").addEventListener("touchend",()=>fh=false);
$("rl").addEventListener("touchstart",e=>{e.preventDefault();reload()});$("nx").addEventListener("touchstart",e=>{e.preventDefault();nextW()});$("zm").addEventListener("touchstart",e=>{e.preventDefault();zoom()});
$("ac").addEventListener("touchstart",e=>{e.preventDefault();actHeld=true});$("ac").addEventListener("touchend",()=>actHeld=false);
function resize(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}addEventListener("resize",resize);resize();
// ---------- loop ----------
function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-last)/1000,.05);last=t;now=t/1000;
 const pa=sg.attributes.position.array;for(let i=0;i<SN;i++){pa[i*3+1]-=dt*(1.5+(i%5)*.25);pa[i*3]+=Math.sin(now*.6+i)*dt*.35;if(pa[i*3+1]<0)pa[i*3+1]+=20}sg.attributes.position.needsUpdate=true;
 if(!mode){C.position.set(0,6,0);C.rotation.set(-.15,now/6,0);snow.position.set(0,0,0);vm.visible=false;R.render(S,C);return}
 const sim=!inMenu||mode==="mp"||mode==="coopc"||mode==="team"&&NETC.host&&NETC.conn&&NETC.conn.open;
 if(sim){
  if(alive&&!inMenu){cd-=dt;if(rel>0){rel-=dt;if(rel<=0){mg[cur]=W[cur].mag;hud()}}
   let fx=(key.KeyD?1:0)-(key.KeyA?1:0)+mv.x,fz=(key.KeyS?1:0)-(key.KeyW?1:0)+mv.y;const l=Math.hypot(fx,fz);if(l>1){fx/=l;fz/=l}
   const frozen=(mode==="team"||mode==="coopc")&&phase==="freeze"||busy;moving=l>.1&&!frozen;
   if(!frozen){const sp=(cur==="knife"?6.5:5.5)*(zoomed?.5:1)*dt,cs=Math.cos(yaw),sn=Math.sin(yaw);P.x+=(fx*cs+fz*sn)*sp;P.z+=(-fx*sn+fz*cs)*sp;resolve(P,.45);bob+=l*dt*9}
   if(fh&&W[cur].auto)shoot()}
  else moving=false;
  if(mode==="team"){teamTick(dt);if(NETC.host)netSnap(dt)}
  for(const k in rem){const r=rem[k],g=r.g,dx=r.tx-g.position.x,dz=r.tz-g.position.z;g.position.x+=dx*Math.min(1,dt*12);g.position.z+=dz*Math.min(1,dt*12);g.rotation.y=r.ty+Math.PI;r.ph+=Math.hypot(dx,dz)*6;g.userData.legs[0].rotation.x=Math.sin(r.ph)*.7;g.userData.legs[1].rotation.x=-Math.sin(r.ph)*.7}
  for(let i=trs.length-1;i>=0;i--){trs[i].t-=dt;if(trs[i].t<=0){S.remove(trs[i].l);trs.splice(i,1)}}
  $("flash").style.opacity=Math.max(0,parseFloat($("flash").style.opacity||0)-dt*.8);
  hudT-=dt;if(hudT<0){hud();renderFeed();hudT=.1}}
 // camera
 let spectating=false;bots.forEach(b=>{if(b.alive)b.g.visible=true});
 if(!alive&&(mode==="team"||mode==="coopc")&&phase!=="over"){const l=bots.filter(b=>b.alive&&b.team===myS()),L=l.length?l:bots.filter(b=>b.alive);
  if(L.length){const tb=L[spec%L.length];spectating=true;tb.g.visible=false;C.position.set(tb.g.position.x,1.62,tb.g.position.z);C.rotation.set(0,tb.g.rotation.y+Math.PI,0);$("dead").textContent="Наблюдение: "+tb.name+" (нажми, чтобы сменить)"}}
 if(!spectating){C.position.set(P.x,1.6+Math.sin(bob)*.035,P.z);C.rotation.set(pitch,yaw,0)}
 snow.position.set(C.position.x,0,C.position.z);
 C.fov+=((zoomed?22:75)-C.fov)*Math.min(1,dt*14);C.updateProjectionMatrix();$("scope").style.display=zoomed&&C.fov<40?"block":"none";$("cross").style.display=zoomed||!alive?"none":"block";
 kick=Math.max(0,kick-dt*8);slash=Math.max(0,slash-dt*3);sw=Math.max(0,sw-dt*4);flashT-=dt;flashM.visible=flashT>0;
 const rl=rel>0?Math.sin(Math.min(1,(1-rel/(cur==="awp"?2.2:1.5)))*Math.PI):0;
 vm.visible=alive&&!(zoomed&&C.fov<40);vm.position.set(.22+Math.sin(bob*.5)*.01,-.26-sw*.4-rl*.3+Math.abs(Math.sin(bob))*.012,-.5+kick*.07);
 vm.rotation.set(kick*.1-rl*.5+(cur==="knife"?slash*.9:0),cur==="knife"?-slash*1.1:0,cur==="knife"?slash*.5:0);
 R.render(S,C)}
buildVM("rifle");hud();openMenu("play");requestAnimationFrame(loop);
